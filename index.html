<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>GodotShooter</title>
		<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

html, body, #canvas { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; }
body {
    background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
    overflow: hidden; touch-action: none; font-family: 'Outfit', sans-serif; color: #fff;
}
#canvas { display: block; position: absolute; z-index: 1; }
#canvas:focus { outline: none; }

#status {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: linear-gradient(135deg, rgba(20,20,30,0.95), rgba(10,10,15,0.98));
    backdrop-filter: blur(15px); z-index: 10; visibility: hidden;
    transition: opacity 0.5s ease;
}

#status-splash {
    max-height: 30vh;
    margin-bottom: 40px;
    filter: drop-shadow(0 0 20px rgba(100, 150, 255, 0.5));
    animation: float 4s ease-in-out infinite;
}
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

.loader-container {
    width: 60%;
    max-width: 500px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 30px;
    padding: 6px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    position: relative;
    display: none;
}
#status-progress { display: none; } /* hide default progress */

.progress-bar-fill {
    height: 12px;
    border-radius: 20px;
    background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
    width: 0%;
    transition: width 0.2s ease-out;
    box-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
}

.loading-text {
    margin-top: 20px;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.8);
    display: none;
}

#status-notice {
    background-color: rgba(255, 50, 50, 0.2);
    border: 1px solid rgba(255, 50, 50, 0.5);
    border-radius: 12px; padding: 15px 25px; margin-top: 20px;
    color: #ffb3b3; display: none; max-width: 600px; text-align: center;
    backdrop-filter: blur(5px);
}
		</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
            <div class="loader-container" id="loader-container">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
            <div class="loading-text" id="loading-text">Loading...</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":404128,"index.wasm":37900721},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = 'none';
        const loaderContainer = document.getElementById('loader-container');
        const loadingText = document.getElementById('loading-text');
        if (loaderContainer && loadingText) {
            loaderContainer.style.display = mode === 'progress' ? 'block' : 'none';
            loadingText.style.display = mode === 'progress' ? 'block' : 'none';
        }
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
                    const fill = document.getElementById('progress-bar-fill');
                    if (fill) {
                        const percent = (current / total) * 100;
                        fill.style.width = percent + '%';
                        document.getElementById('loading-text').innerText = `LOADING... ${Math.round(percent)}%`;
                    }
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
