<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<title>Kill-Zone 3D Game</title>

	<!--
	  COI SERVICE WORKER — must be first script on the page.
	  Registers coi-serviceworker.js which injects COOP + COEP headers
	  on every response, making crossOriginIsolated = true.
	  GitHub Pages does NOT send these headers natively.
	  On first load: registers SW → reloads.
	  On subsequent loads: SW is active, headers injected, game starts.
	-->
	<script>
	(function () {
		if (!window.crossOriginIsolated && 'serviceWorker' in navigator) {
			navigator.serviceWorker
				.register('./coi-serviceworker.js')
				.then(function (reg) {
					// New SW installed: wait for activation then reload
					if (reg.installing) {
						var sw = reg.installing;
						sw.addEventListener('statechange', function () {
							if (sw.state === 'activated') {
								window.location.reload();
							}
						});
					} else if (reg.waiting) {
						// Waiting SW (update scenario): skip waiting and reload
						reg.waiting.postMessage({ type: 'SKIP_WAITING' });
						window.location.reload();
					}
					// If reg.active — SW already active but page not isolated:
					// This means the SW was registered on a previous session.
					// Headers should already be injected; reload to apply.
					else if (reg.active) {
						window.location.reload();
					}
				})
				.catch(function (err) {
					console.warn('[COI] Service worker registration failed:', err);
				});
		}
	})();
	</script>

	<style>
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}

	html, body {
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #000;
		color: #fff;
		font-family: 'Segoe UI', Arial, sans-serif;
	}

	/* The game canvas fills the full window */
	#canvas {
		display: block;
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		touch-action: none;
		outline: none;
		background: #000;
	}

	#canvas:focus {
		outline: none;
	}

	/* ── Loading / status overlay ── */
	#status {
		position: fixed;
		inset: 0;
		z-index: 200;
		background: linear-gradient(160deg, #0d0d1a 0%, #1a1a2e 55%, #16213e 100%);
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center;
		visibility: visible; /* visible by default so user sees loading */
		transition: opacity 0.4s ease;
	}

	#status.hidden {
		opacity: 0;
		pointer-events: none;
	}

	/* Splash / boot image */
	#status-splash {
		position: absolute;
		inset: 0;
		width: 100%;
		height: 100%;
		object-fit: contain;
		opacity: 0.25;
	}

	#status-splash.show-image--false {
		display: none;
	}

	/* Title */
	#status-title {
		position: relative;
		z-index: 1;
		font-size: clamp(1.4rem, 5vw, 2.8rem);
		font-weight: 700;
		letter-spacing: 0.1em;
		text-transform: uppercase;
		color: #fff;
		text-shadow: 0 0 30px rgba(230, 57, 70, 0.8);
		margin-bottom: 2.5rem;
	}

	/* Progress bar wrapper */
	#progress-wrapper {
		position: relative;
		z-index: 1;
		width: min(70%, 420px);
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 0.7rem;
	}

	#status-progress {
		display: none;
		width: 100%;
		height: 5px;
		-webkit-appearance: none;
		appearance: none;
		border: none;
		border-radius: 3px;
		background: rgba(255,255,255,0.1);
		overflow: hidden;
	}

	#status-progress::-webkit-progress-bar {
		background: rgba(255,255,255,0.08);
		border-radius: 3px;
	}

	#status-progress::-webkit-progress-value {
		background: linear-gradient(90deg, #e63946, #ff6b6b);
		border-radius: 3px;
		transition: width 0.15s ease;
	}

	#status-progress::-moz-progress-bar {
		background: linear-gradient(90deg, #e63946, #ff6b6b);
		border-radius: 3px;
	}

	/* Percentage text */
	#status-label {
		font-size: clamp(10px, 1.5vw, 13px);
		letter-spacing: 3px;
		text-transform: uppercase;
		color: rgba(255,255,255,0.5);
	}

	/* Error / notice box */
	#status-notice {
		display: none;
		position: absolute;
		bottom: 12%;
		left: 50%;
		transform: translateX(-50%);
		width: min(86%, 520px);
		background: rgba(91,57,67,0.92);
		border: 1px solid #c0404f;
		border-radius: 8px;
		padding: 1rem 1.5rem;
		text-align: center;
		font-size: clamp(12px, 1.8vw, 14px);
		line-height: 1.6;
		color: #f0d0d4;
		z-index: 1;
		backdrop-filter: blur(6px);
	}

	/* Animated dots for idle state */
	@keyframes pulse {
		0%, 80%, 100% { opacity: 0.3; }
		40%            { opacity: 1;   }
	}
	.dot { display: inline-block; animation: pulse 1.2s infinite; }
	.dot:nth-child(2) { animation-delay: 0.2s; }
	.dot:nth-child(3) { animation-delay: 0.4s; }
	</style>

	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png">
	<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
</head>
<body>

<canvas id="canvas">Your browser does not support the canvas element.</canvas>

<noscript>
	<p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-size:1.2rem;">
		JavaScript is required to play this game.
	</p>
</noscript>

<div id="status">
	<img id="status-splash" class="show-image--true" src="index.png" alt="">
	<div id="status-title">Kill-Zone 3D</div>
	<div id="progress-wrapper">
		<progress id="status-progress"></progress>
		<div id="status-label">
			Starting<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
		</div>
	</div>
	<div id="status-notice"></div>
</div>

<!-- Godot 4 engine -->
<script src="index.js"></script>
<script>
/*
 * Godot 4 Web Export — Kill-Zone 3D Game
 *
 * KEY SETTINGS:
 *  - canvasResizePolicy: 2  → canvas auto-fits window
 *  - ensureCrossOriginIsolationHeaders: false
 *    → We handle isolation ourselves via coi-serviceworker.js above.
 *      Letting Godot handle it causes a silent fail on GitHub Pages because
 *      GODOT_CONFIG.serviceWorker is undefined and getMissingFeatures() throws.
 */
const GODOT_CONFIG = {
	args: [],
	canvasResizePolicy: 2,
	emscriptenPoolSize: 8,
	ensureCrossOriginIsolationHeaders: false,
	executable: "index",
	experimentalVK: false,
	fileSizes: { "index.pck": 76244, "index.wasm": 37900721 },
	focusCanvas: true,
	gdextensionLibs: [],
	godotPoolSize: 4
};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	var statusEl   = document.getElementById('status');
	var progressEl = document.getElementById('status-progress');
	var noticeEl   = document.getElementById('status-notice');
	var labelEl    = document.getElementById('status-label');

	function showProgress() {
		progressEl.style.display = 'block';
		labelEl.innerHTML = 'Loading... <span id="pct">0</span>%';
	}

	function updateProgress(current, total) {
		if (current > 0 && total > 0) {
			progressEl.value = current;
			progressEl.max   = total;
			var pct = document.getElementById('pct');
			if (pct) pct.textContent = Math.round((current / total) * 100);
		} else {
			progressEl.removeAttribute('value');
			progressEl.removeAttribute('max');
		}
	}

	function showError(err) {
		var msg = (err instanceof Error) ? err.message
		        : (typeof err === 'string') ? err
		        : 'An unknown error occurred.';
		console.error('[Godot]', err);
		noticeEl.style.display = 'block';
		noticeEl.textContent   = msg;
		// Keep status overlay visible to show the error
		statusEl.style.visibility = 'visible';
	}

	function hideStatus() {
		statusEl.classList.add('hidden');
		// Remove from DOM after fade
		setTimeout(function () { statusEl.remove(); }, 500);
	}

	// Check for missing features (SharedArrayBuffer, WebGL 2, etc.)
	var missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

	if (missing.length > 0) {
		var msg = 'Your browser is missing required features:\n' + missing.join('\n')
		        + '\n\nTry Chrome or Firefox (desktop) and make sure hardware acceleration is enabled.';
		showError(msg);
		return;
	}

	// Start the game
	showProgress();
	engine.startGame({
		onProgress: function (current, total) {
			updateProgress(current, total);
		}
	}).then(function () {
		hideStatus();
	}).catch(function (err) {
		showError(err);
	});
}());
</script>

</body>
</html>
