<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<title>Kill-Zone 3D Game</title>
		<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

html, body {
	width: 100%;
	height: 100%;
	overflow: hidden;
	background-color: #000;
	touch-action: none;
}

#canvas-container {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	display: flex;
	align-items: center;
	justify-content: center;
	background: #000;
}

#canvas {
	display: block;
	width: 100% !important;
	height: 100% !important;
	touch-action: none;
	outline: none;
}

#canvas:focus {
	outline: none;
}

/* Loading / status overlay */
#status {
	position: fixed;
	top: 0; left: 0; right: 0; bottom: 0;
	background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 100;
}

#status-splash {
	position: absolute;
	top: 0; left: 0; right: 0; bottom: 0;
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress {
	display: none;
	position: absolute;
	bottom: 15%;
	left: 50%;
	transform: translateX(-50%);
	width: min(60%, 400px);
	height: 6px;
	-webkit-appearance: none;
	appearance: none;
	border-radius: 3px;
	overflow: hidden;
	background: rgba(255,255,255,0.15);
	border: none;
}

#status-progress::-webkit-progress-bar {
	background: rgba(255,255,255,0.1);
	border-radius: 3px;
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #e63946, #ff6b6b);
	border-radius: 3px;
	transition: width 0.2s ease;
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #e63946, #ff6b6b);
	border-radius: 3px;
}

#status-notice {
	display: none;
	position: absolute;
	bottom: 10%;
	left: 50%;
	transform: translateX(-50%);
	width: min(80%, 500px);
	background: rgba(91, 57, 67, 0.9);
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Segoe UI', 'Noto Sans', Arial, sans-serif;
	font-size: clamp(12px, 2vw, 15px);
	line-height: 1.5;
	padding: 1rem 1.5rem;
	text-align: center;
	backdrop-filter: blur(8px);
}

/* Loading label */
#loading-label {
	position: absolute;
	bottom: calc(15% + 20px);
	left: 50%;
	transform: translateX(-50%);
	color: rgba(255,255,255,0.6);
	font-family: 'Segoe UI', Arial, sans-serif;
	font-size: clamp(11px, 1.5vw, 13px);
	letter-spacing: 2px;
	text-transform: uppercase;
	white-space: nowrap;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png">
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
	</head>
	<body>
		<div id="canvas-container">
			<canvas id="canvas">
				Your browser does not support the canvas tag.
			</canvas>
		</div>

		<noscript>
			<p style="color:white;text-align:center;padding:2rem;">Your browser does not support JavaScript.</p>
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="Loading Kill-Zone 3D">
			<div id="loading-label">Loading...</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<!-- Cross-Origin Isolation: register service worker to inject COOP/COEP headers
		     so Godot's SharedArrayBuffer requirement works on GitHub Pages -->
		<script>
		(function() {
			if ('serviceWorker' in navigator) {
				// Check if we already have cross-origin isolation
				if (!self.crossOriginIsolated) {
					navigator.serviceWorker.register('./coi-serviceworker.js').then(function(reg) {
						// If this is a fresh install, reload so the SW activates and headers apply
						if (reg.installing) {
							reg.installing.addEventListener('statechange', function(e) {
								if (e.target.state === 'activated') {
									window.location.reload();
								}
							});
						}
					}).catch(function(err) {
						console.warn('COI Service Worker registration failed:', err);
					});
				}
			}
		})();
		</script>

		<script src="index.js"></script>
		<script>
// Godot engine config — canvasResizePolicy 2 = adaptive (fills container)
const GODOT_CONFIG = {
	"args": [],
	"canvasResizePolicy": 2,
	"emscriptenPoolSize": 8,
	"ensureCrossOriginIsolationHeaders": true,
	"executable": "index",
	"experimentalVK": false,
	"fileSizes": { "index.pck": 76244, "index.wasm": 37900721 },
	"focusCanvas": true,
	"gdextensionLibs": [],
	"godotPoolSize": 4
};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const loadingLabel = document.getElementById('loading-label');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		if (loadingLabel) loadingLabel.style.display = mode === 'progress' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					if (loadingLabel) {
						const pct = Math.round((current / total) * 100);
						loadingLabel.textContent = 'Loading... ' + pct + '%';
					}
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
