<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<title>Kill-Zone 3D Game</title>



	<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }

	html, body {
		width: 100%; height: 100%;
		overflow: hidden;
		background: #000; color: #fff;
		font-family: 'Segoe UI', Arial, sans-serif;
	}

	#canvas {
		display: block;
		position: fixed; top: 0; left: 0;
		width: 100%; height: 100%;
		touch-action: none; outline: none;
		background: #000;
	}
	#canvas:focus { outline: none; }

	#status {
		position: fixed; inset: 0; z-index: 200;
		background: linear-gradient(160deg, #0d0d1a 0%, #1a1a2e 55%, #16213e 100%);
		display: flex; flex-direction: column;
		justify-content: center; align-items: center;
		visibility: visible;
		transition: opacity 0.4s ease;
	}
	#status.hidden { opacity: 0; pointer-events: none; }

	#status-splash {
		position: absolute; inset: 0;
		width: 100%; height: 100%;
		object-fit: contain; opacity: 0.18;
	}
	#status-splash.show-image--false { display: none; }

	#status-title {
		position: relative; z-index: 1;
		font-size: clamp(1.4rem, 5vw, 2.8rem);
		font-weight: 700; letter-spacing: 0.12em;
		text-transform: uppercase; color: #fff;
		text-shadow: 0 0 40px rgba(230,57,70,0.9);
		margin-bottom: 2.5rem;
	}

	#progress-wrapper {
		position: relative; z-index: 1;
		width: min(70%, 420px);
		display: flex; flex-direction: column;
		align-items: center; gap: 0.7rem;
	}

	#status-progress {
		display: none; width: 100%; height: 5px;
		-webkit-appearance: none; appearance: none;
		border: none; border-radius: 3px;
		background: rgba(255,255,255,0.1); overflow: hidden;
	}
	#status-progress::-webkit-progress-bar  { background: rgba(255,255,255,0.08); border-radius: 3px; }
	#status-progress::-webkit-progress-value { background: linear-gradient(90deg,#e63946,#ff6b6b); border-radius: 3px; transition: width .15s ease; }
	#status-progress::-moz-progress-bar     { background: linear-gradient(90deg,#e63946,#ff6b6b); border-radius: 3px; }

	#status-label {
		font-size: clamp(10px,1.5vw,13px);
		letter-spacing: 3px; text-transform: uppercase;
		color: rgba(255,255,255,0.5);
	}

	#status-notice {
		display: none;
		position: absolute; bottom: 12%;
		left: 50%; transform: translateX(-50%);
		width: min(86%, 520px);
		background: rgba(91,57,67,0.92);
		border: 1px solid #c0404f; border-radius: 8px;
		padding: 1rem 1.5rem; text-align: center;
		font-size: clamp(12px,1.8vw,14px); line-height: 1.6;
		color: #f0d0d4; z-index: 1; backdrop-filter: blur(6px);
	}

	@keyframes pulse {
		0%,80%,100% { opacity: 0.3; }
		40%          { opacity: 1;   }
	}
	.dot { display: inline-block; animation: pulse 1.2s infinite; }
	.dot:nth-child(2) { animation-delay: 0.2s; }
	.dot:nth-child(3) { animation-delay: 0.4s; }
	</style>

	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png">
	<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
</head>
<body>

<canvas id="canvas">Your browser does not support the canvas element.</canvas>

<noscript>
	<p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-size:1.2rem;padding:2rem;text-align:center;">
		JavaScript is required to play this game.
	</p>
</noscript>

<div id="status">
	<img id="status-splash" class="show-image--true" src="index.png" alt="">
	<div id="status-title">Kill-Zone 3D</div>
	<div id="progress-wrapper">
		<progress id="status-progress"></progress>
		<div id="status-label">
			Starting<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
		</div>
	</div>
	<div id="status-notice"></div>
</div>

<script src="index.js"></script>
<script>
const GODOT_CONFIG = {
	args: [],
	canvasResizePolicy: 2,
	emscriptenPoolSize: 8,
	ensureCrossOriginIsolationHeaders: false,
	executable: "index",
	experimentalVK: false,
	fileSizes: { "index.pck": 112780, "index.wasm": 37900721 },
	focusCanvas: true,
	gdextensionLibs: [],
	godotPoolSize: 4
};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	var statusEl   = document.getElementById('status');
	var progressEl = document.getElementById('status-progress');
	var noticeEl   = document.getElementById('status-notice');
	var labelEl    = document.getElementById('status-label');

	function showProgress() {
		progressEl.style.display = 'block';
		labelEl.innerHTML = 'Loading... <span id="pct">0</span>%';
	}
	function updateProgress(current, total) {
		if (current > 0 && total > 0) {
			progressEl.value = current; progressEl.max = total;
			var pct = document.getElementById('pct');
			if (pct) pct.textContent = Math.round((current / total) * 100);
		} else {
			progressEl.removeAttribute('value'); progressEl.removeAttribute('max');
		}
	}
	function showError(err) {
		var msg = (err instanceof Error) ? err.message : (typeof err === 'string') ? err : 'An unknown error occurred.';
		console.error('[Godot]', err);
		noticeEl.style.display = 'block';
		noticeEl.textContent = msg;
		statusEl.style.visibility = 'visible';
		labelEl.style.display = 'none';
	}
	function hideStatus() {
		statusEl.classList.add('hidden');
		setTimeout(function () { if (statusEl.parentNode) statusEl.remove(); }, 500);
	}

	var missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length > 0) {
		showError('Your browser is missing required features:\n' + missing.join('\n') + '\n\nTry Chrome or Firefox on desktop with hardware acceleration enabled.');
		return;
	}

	showProgress();
	engine.startGame({
		onProgress: function (current, total) { updateProgress(current, total); }
	}).then(function () {
		hideStatus();
	}).catch(function (err) {
		showError(err);
	});
}());
</script>

</body>
</html>
